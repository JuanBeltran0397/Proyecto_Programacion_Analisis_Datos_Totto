name: Pipeline CI/CD - Web Scraping Totto

on:
  push:
    branches: [ "main", "rama_automatizacion", "mejoras-ea3" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Ejecución programada todos los lunes a las 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  ci-calidad-y-pruebas:
    name: CI - Linting y Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Análisis estático de código (Flake8)
        run: >
          flake8 scraper.py test_scraper.py generar_reporte.py test_reporte.py
          --count --max-line-length=100 --statistics

      - name: 5. Ejecutar pruebas automatizadas (Pytest)
        run: pytest test_scraper.py test_reporte.py -v

  cd-extraccion-y-despliegue:
    name: CD - Actualización Dataset y Reporte HTML
    needs: ci-calidad-y-pruebas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 2. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar dependencias
        run: pip install -r requirements.txt

      - name: 4. Ejecutar scraper de catálogo Totto
        env:
          TOTTO_BASE_URL: "https://co.totto.com"
        run: python scraper.py

      - name: 5. Generar reporte visual HTML (docs/index.html)
        run: python generar_reporte.py

      - name: 6. Publicar CSV y HTML actualizados en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/totto_ejecutivos.csv docs/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cd): actualizar dataset y reporte HTML [skip ci]" && git push)
